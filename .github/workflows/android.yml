name: Android build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Ensure Android SDK 35
        shell: bash
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Unit tests, lint, and test fixture
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :test-fixture:assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          retention-days: 14

  release:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == 'an-stu/CiviAdShield'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Ensure Android SDK 35
        shell: bash
        run: |
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Restore signing from encrypted repository secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 tools/ci-release.py restore-signing
      - name: Build signed APK
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain
      - name: Verify signature and prepare release assets
        run: python3 tools/ci-release.py package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-apk-${{ github.sha }}
          path: release-artifacts/
          retention-days: 14
      - name: Publish new application versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci-release.py publish
      - name: Remove runner signing material
        if: always()
        run: rm -rf .signing "$RUNNER_TEMP/civi-adshield-signing.jks"
